name: Release

# Publishing is triggered by pushing a version tag:
#
#     ./scripts/release.sh 0.2.0
#
# which bumps Cargo.toml, commits, tags v0.2.0 and pushes. Nothing publishes
# from a laptop.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate but do not upload to crates.io"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  NETWORKCOP_NO_UPDATE_CHECK: "1"

jobs:
  publish:
    name: gate · publish · announce
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # A tag that disagrees with Cargo.toml would publish the wrong version
      # under the right name — unfixable after the fact, since crates.io versions
      # are immutable. Fail before the upload, not after.
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -m1 '^version *= *' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $MANIFEST"
            exit 1
          fi

      # crates.io versions cannot be replaced. If this version is already up,
      # stop cleanly rather than failing the run on a duplicate upload.
      - name: Version must not already exist on crates.io
        id: exists
        run: |
          V=$(grep -m1 '^version *= *' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
            -H 'User-Agent: networkcop-release (+https://github.com/banavasi/networkcop)' \
            https://crates.io/api/v1/crates/networkcop)
          if [ "$CODE" = "200" ] && jq -e --arg v "$V" '.versions[] | select(.num == $v)' /tmp/crate.json >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::networkcop $V is already published — skipping upload"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Release build must be warning-free
        run: cargo build --release
        env:
          RUSTFLAGS: "-D warnings"

      - name: Package check
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: steps.exists.outputs.already == 'false' && inputs.dry_run != true
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Announce the new version. `networkcop update` reads crates.io, so once
      # this lands every running copy learns about it on next start.
      - name: Wait for the registry to serve it
        if: steps.exists.outputs.already == 'false' && inputs.dry_run != true
        run: |
          V="${{ steps.exists.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -sS -H 'User-Agent: networkcop-release' \
                 https://crates.io/api/v1/crates/networkcop | jq -e --arg v "$V" \
                 '.versions[] | select(.num == $v)' >/dev/null; then
              echo "networkcop $V is live on crates.io"; exit 0
            fi
            sleep 10
          done
          echo "::warning::registry did not serve $V within 5 minutes"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.exists.outputs.version }}"
          {
            printf 'Install or update:\n\n'
            printf '    cargo install networkcop --force\n\n'
            printf 'Check your version:\n\n'
            printf '    networkcop update\n'
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "networkcop $V" \
            --generate-notes \
            --notes-file /tmp/notes.md

      - name: Summary
        run: |
          {
            echo "### networkcop ${{ steps.exists.outputs.version }}"
            echo
            if [ "${{ steps.exists.outputs.already }}" = "true" ]; then
              echo "Already on crates.io — upload skipped."
            elif [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — all gates passed, nothing uploaded."
            else
              echo "Published to crates.io."
            fi
            echo
            echo '```'
            echo 'cargo install networkcop --force'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
